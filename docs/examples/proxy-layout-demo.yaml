# Issue #2 代理页布局验证配置；适用于随包 Mihomo v1.19.30。
# 导入：配置 → 导入本地 YAML；激活后切到代理页，使用规则模式。
# 35 个假节点使用文档保留网段 192.0.2.0/24，密码和 UUID 均为演示值。
# 这些节点无法代理上网，测速应超时；YAML 不能预填真实的测速历史。
# MATCH,DIRECT 让规则模式的普通流量保持直连；请在验证后切回原配置。
# 验证：首次进入、测速中/超时、切换选中节点、折叠展开、调整窗口、切换中英文。
# 新加坡 9 项占三整行；香港 8 项的末行两项应保持列宽；单节点组也不应拉伸。
# 自动选择/故障转移各 35 项，默认折叠，可展开后验证“显示更多”。

mode: rule # 按 rules 选择出站；保持代理组列表可见。
log-level: warning # 仅记录警告及错误，减少假节点失败日志。

